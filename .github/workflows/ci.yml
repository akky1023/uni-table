name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: flutter/flutter
          ref: abaf9c523780a608bd46686fd5e53740a07077f8 # 3.47.7
          path: .tools/flutter
          persist-credentials: false
      - name: Restore verified Flutter version tag
        run: |
          git -C .tools/flutter fetch --no-tags --depth 1 origin tag 3.47.7
          if ($LASTEXITCODE -ne 0) { throw 'Flutter version tag fetch failed.' }
          if ((git -C .tools/flutter rev-parse 'refs/tags/3.47.7^{commit}') -cne 'abaf9c523780a608bd46686fd5e53740a07077f8') { throw 'Flutter version tag was changed.' }
      - name: Add Flutter to PATH
        run: '"$env:GITHUB_WORKSPACE\.tools\flutter\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8'
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
