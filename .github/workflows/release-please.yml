name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'akky1023/uni-table' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # GITHUB_TOKEN製のリリースPRにCIを明示的に起動するため。
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # 可変のv4タグではなく、公式リポジトリのコミットSHAに固定する。
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI for the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          printf '%s' "$RELEASE_PRS" | jq -er '.[].headBranchName' | while IFS= read -r branch; do
              case "$branch" in
                release-please--branches--main*) ;;
                *) echo 'Unexpected release PR branch'; exit 1 ;;
              esac
              gh workflow run ci.yml --ref "$branch"
            done

  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - name: Verify release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -cne "v$env:RELEASE_VERSION") { throw 'Release tag mismatch.' }
          if ((git rev-parse HEAD) -cne $env:RELEASE_SHA) { throw 'Release commit mismatch.' }
          $version = [regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$')
          if (-not $version.Success -or $version.Groups[1].Value -cne $env:RELEASE_VERSION) { throw 'Release version mismatch.' }
          $code = [long]$version.Groups[2].Value
          if ($code -lt 18 -or $code -gt 2100000000) { throw 'Android build number out of range.' }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Published releases must not be overwritten.' }
      - name: Install pinned Flutter SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: flutter/flutter
          ref: abaf9c523780a608bd46686fd5e53740a07077f8 # 3.47.7
          path: .tools/flutter
          persist-credentials: false
      - name: Restore verified Flutter version tag
        run: |
          git -C .tools/flutter fetch --no-tags --depth 1 origin tag 3.47.7
          if ($LASTEXITCODE -ne 0) { throw 'Flutter version tag fetch failed.' }
          if ((git -C .tools/flutter rev-parse 'refs/tags/3.47.7^{commit}') -cne 'abaf9c523780a608bd46686fd5e53740a07077f8') { throw 'Flutter version tag was changed.' }
      - name: Add Flutter to PATH
        run: '"$env:GITHUB_WORKSPACE\.tools\flutter\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8'
      - name: Restore official Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_PASSWORD', 'ANDROID_KEY_ALIAS')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing repository secret: $name" }
          }
          $signing = Join-Path $env:GITHUB_WORKSPACE '.tools/signing'
          New-Item -ItemType Directory -Force $signing | Out-Null
          $keyStore = Join-Path $signing 'unitable-release.jks'
          [IO.File]::WriteAllBytes($keyStore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $properties = "storeFile=$($keyStore.Replace('\','/'))`nstorePassword=$env:ANDROID_STORE_PASSWORD`nkeyPassword=$env:ANDROID_KEY_PASSWORD`nkeyAlias=$env:ANDROID_KEY_ALIAS`n"
          [IO.File]::WriteAllText((Join-Path $signing 'android-key.properties'), $properties, [Text.UTF8Encoding]::new($false))
      - name: Prepare toolchains and locked dependencies
        run: |
          & scripts/setup-windows.ps1
          & scripts/setup-android.ps1 -AcceptLicenses
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency restore failed.' }
      - name: Build and verify release packages
        run: '& scripts/build-release.ps1 -Target all -SkipRestore'
      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.apk
            dist/*-setup.exe
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Attach artifacts and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.apk', '.exe', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | Select-Object -ExpandProperty FullName)
          gh release upload $env:RELEASE_TAG @artifacts --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Remove signing material
        if: always()
        run: |
          $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '.tools/signing'))
          $root = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE) + [IO.Path]::DirectorySeparatorChar
          if (-not $target.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid signing cleanup path.' }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
